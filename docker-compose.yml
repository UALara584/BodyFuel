services:
  db:
    image: postgres:15
    container_name: bodyfuel_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bodyfuel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bodyfuel}
      POSTGRES_DB: ${POSTGRES_DB:-bodyfuel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: bodyfuel_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: bodyfuel_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bodyfuel}:${POSTGRES_PASSWORD:-bodyfuel}@db:5432/${POSTGRES_DB:-bodyfuel}
      EDAMAM_APP_ID: ${EDAMAM_APP_ID:-}
      EDAMAM_APP_KEY: ${EDAMAM_APP_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}

  frontend:
    build: ./frontend
    container_name: bodyfuel_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}

  scraper:
    build: ./scraper
    container_name: bodyfuel_scraper
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bodyfuel}:${POSTGRES_PASSWORD:-bodyfuel}@db:5432/${POSTGRES_DB:-bodyfuel}
      VITONICA_URLS: ${VITONICA_URLS:-https://www.vitonica.com/categoria/recetas-saludables/record/20,https://www.vitonica.com/categoria/recetas-saludables/record/40,https://www.vitonica.com/categoria/recetas-saludables/record/60,https://www.vitonica.com/categoria/recetas-saludables/record/80,https://www.vitonica.com/categoria/recetas-saludables/record/100}

volumes:
  postgres_data:
